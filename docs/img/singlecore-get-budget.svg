<svg xmlns="http://www.w3.org/2000/svg" width="640" height="228" viewBox="0 0 640 228" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="640" height="228" fill="#ffffff"/>
<text x="190" y="24" font-size="16" font-weight="600" fill="#1f2933">Cost of one single-core Get, by layer (ns/op, cumulative)</text>
<line x1="190" y1="40" x2="190" y2="76" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="63" font-size="13" fill="#1f2933" text-anchor="end">benchmark harness only</text>
<rect x="190" y="44" width="15.2" height="28" rx="3" fill="#2563eb"/>
<text x="213.2" y="63" font-size="13" fill="#1f2933">0.75 ns/op</text>
<line x1="190" y1="82" x2="190" y2="118" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="105" font-size="13" fill="#1f2933" text-anchor="end">+ Go map lookup</text>
<rect x="190" y="86" width="245.4" height="28" rx="3" fill="#2563eb"/>
<text x="443.4" y="105" font-size="13" fill="#1f2933">12.16 ns/op</text>
<line x1="190" y1="124" x2="190" y2="160" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="147" font-size="13" fill="#1f2933" text-anchor="end">+ sync.RWMutex</text>
<rect x="190" y="128" width="317.1" height="28" rx="3" fill="#2563eb"/>
<text x="515.1" y="147" font-size="13" fill="#1f2933">15.71 ns/op</text>
<line x1="190" y1="166" x2="190" y2="202" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="189" font-size="13" fill="#1f2933" text-anchor="end">SingleCoreCache.Get</text>
<rect x="190" y="170" width="330.0" height="28" rx="3" fill="#059669"/>
<text x="528.0" y="189" font-size="13" fill="#1f2933">16.35 ns/op</text>
</svg>
