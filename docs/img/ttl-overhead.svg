<svg xmlns="http://www.w3.org/2000/svg" width="640" height="228" viewBox="0 0 640 228" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="640" height="228" fill="#ffffff"/>
<text x="190" y="24" font-size="16" font-weight="600" fill="#1f2933">TTL overhead: only the TTL path pays (ns/op, lower is better)</text>
<line x1="190" y1="40" x2="190" y2="76" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="63" font-size="13" fill="#1f2933" text-anchor="end">Get (no TTL)</text>
<rect x="190" y="44" width="180.4" height="28" rx="3" fill="#059669"/>
<text x="378.4" y="63" font-size="13" fill="#1f2933">22.94 ns/op</text>
<line x1="190" y1="82" x2="190" y2="118" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="105" font-size="13" fill="#1f2933" text-anchor="end">GetWithTTL</text>
<rect x="190" y="86" width="224.5" height="28" rx="3" fill="#2563eb"/>
<text x="422.5" y="105" font-size="13" fill="#1f2933">28.54 ns/op</text>
<line x1="190" y1="124" x2="190" y2="160" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="147" font-size="13" fill="#1f2933" text-anchor="end">Set (no TTL)</text>
<rect x="190" y="128" width="242.5" height="28" rx="3" fill="#059669"/>
<text x="440.5" y="147" font-size="13" fill="#1f2933">30.84 ns/op</text>
<line x1="190" y1="166" x2="190" y2="202" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="189" font-size="13" fill="#1f2933" text-anchor="end">SetWithTTL</text>
<rect x="190" y="170" width="330.0" height="28" rx="3" fill="#2563eb"/>
<text x="528.0" y="189" font-size="13" fill="#1f2933">41.96 ns/op</text>
</svg>
