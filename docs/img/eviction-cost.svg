<svg xmlns="http://www.w3.org/2000/svg" width="640" height="186" viewBox="0 0 640 186" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="640" height="186" fill="#ffffff"/>
<text x="190" y="24" font-size="16" font-weight="600" fill="#1f2933">WithMaxSize eviction cost on Set (ns/op, lower is better)</text>
<line x1="190" y1="40" x2="190" y2="76" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="63" font-size="13" fill="#1f2933" text-anchor="end">Set (unbounded)</text>
<rect x="190" y="44" width="68.2" height="28" rx="3" fill="#059669"/>
<text x="266.2" y="63" font-size="13" fill="#1f2933">33.11 ns/op</text>
<line x1="190" y1="82" x2="190" y2="118" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="105" font-size="13" fill="#1f2933" text-anchor="end">SetWithMaxSize (~50% evict)</text>
<rect x="190" y="86" width="269.2" height="28" rx="3" fill="#2563eb"/>
<text x="467.2" y="105" font-size="13" fill="#1f2933">130.80 ns/op</text>
<line x1="190" y1="124" x2="190" y2="160" stroke="#cbd5e1" stroke-width="1"/>
<text x="180" y="147" font-size="13" fill="#1f2933" text-anchor="end">EvictionChurn (always evicts)</text>
<rect x="190" y="128" width="360.0" height="28" rx="3" fill="#2563eb"/>
<text x="558.0" y="147" font-size="13" fill="#1f2933">174.90 ns/op</text>
</svg>
