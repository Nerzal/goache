name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, vet, fmt, test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go test -race
        run: go test -race ./...

      - name: bench module build + vet
        working-directory: bench
        run: |
          go build ./...
          go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Pinned, not "latest": the action's "latest" for its v6 line resolved
      # to golangci-lint v1.64.8, which is built with Go 1.24 and refuses to
      # load a config targeting a newer Go ("the Go language version used to
      # build golangci-lint is lower than the targeted Go version"). Our
      # .golangci.yml is also schema v2, which only golangci-lint v2 reads.
      # Keep GOLANGCI_LINT_VERSION in step with the version `make lint` uses
      # locally, so a green local run means a green CI run.
      - name: golangci-lint (root module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1

      - name: golangci-lint (bench module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          working-directory: bench

  benchmark:
    name: benchmarks (informational, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go test -bench
        run: go test -bench=. -benchmem -run=^$ ./...
