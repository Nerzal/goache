name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, vet, fmt, test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go test -race
        run: go test -race ./...

      - name: bench module build + vet
        working-directory: bench
        run: |
          go build ./...
          go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint (root module)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: golangci-lint (bench module)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: bench

  benchmark:
    name: benchmarks (informational, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test -bench
        run: go test -bench=. -benchmem -run=^$ ./...
